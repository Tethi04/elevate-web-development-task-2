<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraTasks | Dynamic To-Do Web App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Ambient Background Glows -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="app-container">
    <!-- App Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">✨</span>
        <h1>Aura<span class="highlight">Tasks</span></h1>
      </div>
      <p class="subtitle">Elevate Labs Web Internship — Task 2</p>
    </header>

    <!-- Progress Card -->
    <section class="progress-card">
      <div class="progress-info">
        <span class="progress-title">Task Completion</span>
        <span id="progressText" class="progress-count">0 of 0 completed</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Task Input Form -->
    <form id="todoForm" class="input-group">
      <input 
        type="text" 
        id="todoInput" 
        placeholder="Add a new task..." 
        autocomplete="off"
        required 
      />
      <button type="submit" id="addBtn" class="btn-add">
        <span>Add</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </form>

    <!-- Filter & Action Controls -->
    <div class="controls-bar">
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clearCompletedBtn" class="btn-clear">Clear Completed</button>
    </div>

    <!-- Task List Container -->
    <ul id="todoList" class="todo-list"></ul>

    <!-- Empty State Message -->
    <div id="emptyState" class="empty-state">
      <p class="empty-title">No tasks found</p>
      <p class="empty-sub">Add a new goal above to get started!</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
  </html>
